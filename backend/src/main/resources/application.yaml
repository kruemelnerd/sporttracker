spring:
  application:
    name: running-dashboard-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/running_dashboard}
    username: ${DATABASE_USERNAME:running_dashboard}
    password: ${DATABASE_PASSWORD:running_dashboard}
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${IMPORT_MAX_FILE_BYTES:10485760}B
      max-request-size: ${IMPORT_MAX_REQUEST_BYTES:104857600}B

server:
  port: ${SERVER_PORT:8080}

running-dashboard:
  display-timezone: ${DISPLAY_TIMEZONE:Europe/Berlin}
  data-directory: ${DATA_DIRECTORY:./data}
  import:
    enabled: true
    max-batch-count: ${IMPORT_MAX_BATCH_COUNT:10}
    max-file-bytes: ${IMPORT_MAX_FILE_BYTES:10485760}
    max-request-bytes: ${IMPORT_MAX_REQUEST_BYTES:104857600}
