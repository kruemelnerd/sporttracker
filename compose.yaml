services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-running_dashboard}
      POSTGRES_USER: ${POSTGRES_USER:-running_dashboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-running_dashboard}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - running-dashboard-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  running-dashboard-postgres:
