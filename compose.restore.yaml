services:
  app:
    image: ${SPORTTRACKER_IMAGE:?Set SPORTTRACKER_IMAGE}@${SPORTTRACKER_IMAGE_DIGEST:?Set SPORTTRACKER_IMAGE_DIGEST}
    environment:
      SPRING_PROFILES_ACTIVE: container
      DATA_DIRECTORY: /data
      INTERVALS_ICU_ENABLED: "false"
    ports:
      - "127.0.0.1:${RESTORE_APP_PORT:-18082}:8080"
    secrets:
      - source: app_database_url
        target: DATABASE_URL
      - source: app_database_username
        target: DATABASE_USERNAME
      - source: app_database_password
        target: DATABASE_PASSWORD
    volumes:
      - fit:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "java", "-cp", "/healthcheck", "Healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  db:
    image: postgres:18.6-bookworm@sha256:bbf83594798e144bff365a9c191c5d779f181fb3135902064ab8ff11918020fc
    environment:
      POSTGRES_USER: running_dashboard_admin
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets:
      - postgres_admin_password
      - postgres_app_password
    volumes:
      - postgres:/var/lib/postgresql
      - ./docker/postgres/init-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
      - /var/run/postgresql:rw,noexec,nosuid,size=16m,mode=3775
    cap_drop: [NET_RAW]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U running_dashboard -d running_dashboard"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s

secrets:
  postgres_admin_password:
    file: ${POSTGRES_ADMIN_PASSWORD_FILE:?Set fresh test admin password file}
  postgres_app_password:
    file: ${POSTGRES_APP_PASSWORD_FILE:?Set fresh test app password file}
  app_database_url:
    file: ${APP_DATABASE_URL_FILE:?Set target database URL file}
  app_database_username:
    file: ${APP_DATABASE_USERNAME_FILE:?Set target database username file}
  app_database_password:
    file: ${APP_DATABASE_PASSWORD_FILE:?Set target database password file}

volumes:
  postgres:
  fit:
